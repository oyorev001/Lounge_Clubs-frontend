<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Open School Field</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #fbf6f2;
        color: #2a1a1c;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 26rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b5a5c;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        border: none;
        border-radius: 0.5rem;
        background: #700617;
        color: #fff;
        padding: 0.625rem 1.25rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Open School Field can't reach the network right now. Pages you've already visited are
        still available — try going back, or reconnect and reload.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
